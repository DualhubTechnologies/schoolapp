name: deploy

# Deploys only after the "tests" workflow has passed on a push to main,
# and deploys exactly the commit that was tested. A failing test stops
# the deploy and the live site stays on the last good version. Can
# also be started by hand (Actions -> deploy -> Run workflow).
on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # The Filament theme CSS imports from vendor/, so Composer runs first.
      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-scripts

      # public/build is gitignored, so assets are built here and uploaded.
      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Upload built assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: public/build
          target: /var/www/schoolapp
          overwrite: true

      - name: Pull code and update app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_SHA
          script: |
            set -e
            cd /var/www/schoolapp
            php artisan down --retry=30 || true
            trap 'php artisan up' EXIT

            git fetch origin main
            git reset --hard "$DEPLOY_SHA"

            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            # Queue workers keep the old code in memory: ask them to
            # finish their current job and restart on the new code.
            php artisan queue:restart

            chown -R www-data:www-data storage bootstrap/cache public/build
