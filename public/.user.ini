; Read by PHP-FPM for requests to this app. Phones send pictures at full
; size (they are shrunk on the server, see App\Support\ImageShrinker), and
; PHP's default 2 MB upload limit would refuse most phone photos. The
; forms themselves cap uploads at 10 MB. The web server (nginx
; client_max_body_size) must allow at least this much too.
upload_max_filesize = 12M
post_max_size = 16M
